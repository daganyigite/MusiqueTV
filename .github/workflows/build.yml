name: Construire l'apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Créer la clé de signature (seulement la première fois)
        run: |
          if [ ! -f app/musiquetv.keystore ]; then
            keytool -genkeypair -keystore app/musiquetv.keystore -alias musiquetv \
              -storepass musiquetv -keypass musiquetv -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=MusiqueTV, O=Perso, C=CI"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/musiquetv.keystore
            git commit -m "Clé de signature de l'app [skip ci]"
            git push
          fi

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compiler l'application
        run: gradle assembleRelease --no-daemon

      - name: Renommer l'apk
        run: cp app/build/outputs/apk/release/app-release.apk MusiqueTV.apk

      - name: Garder l'apk dans les résultats du build
        uses: actions/upload-artifact@v4
        with:
          name: MusiqueTV
          path: MusiqueTV.apk

      - name: Publier une version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Musique TV v1.0.${{ github.run_number }}
          files: MusiqueTV.apk
          make_latest: true
